-- ─── dnsdist 1.9.14 ───────────────────────────────────────────────────────────

-- ── Escuta em todas as interfaces ─────────────────────────────────────────
-- Sem addLocal/setLocal o dnsdist só ouve em 127.0.0.1
addLocal("0.0.0.0:53", {reusePort=true})

-- ── Backends ──────────────────────────────────────────────────────────────
-- useProxyProtocol: necessário para Views (split-horizon) — sem isso o
-- pdns-auth veria o IP do dnsdist (10.53.53.13), não o do cliente real,
-- e selecionaria sempre a mesma variante de zona para todo mundo.
newServer({address="10.53.53.11:53", name="pdns-auth",     pool="auth", checkType="SOA", checkName="results.com.br.", useProxyProtocol=true})
newServer({address="10.53.53.12:53", name="pdns-recursor", pool="recurse"})

-- ── ACLs ───────────────────────────────────────────────────────────────────
-- Aceita queries de qualquer origem (DNS autoritativo público).
-- O roteamento interno/externo é feito pelas regras de pool abaixo.
setACL({"0.0.0.0/0", "::/0"})

-- ── Console API ────────────────────────────────────────────────────────────
controlSocket("127.0.0.1:5199")

-- ── Webserver ─────────────────────────────────────────────────────────────
webserver("0.0.0.0:8083")
setWebserverConfig({
  password=hashPassword("DNSDIST_WEB_PASSWORD_PLACEHOLDER"),
  apiKey=hashPassword("DNSDIST_API_KEY_PLACEHOLDER"),
  acl="127.0.0.1,10.53.53.0/24,10.0.0.0/8",
})

-- ── Rate limiting ─────────────────────────────────────────────────────────
addAction(MaxQPSIPRule(100), DropAction())
addAction(QTypeRule(DNSQType.ANY), TCAction())

-- ── Roteamento ────────────────────────────────────────────────────────────
-- IMPORTANTE: PoolAction() é terminal por padrão (stop=true) — a primeira
-- regra que casar decide o destino e as seguintes não são avaliadas. A ordem
-- abaixo é proposital (mais específico → mais genérico).

local privateNets = newNMG()
privateNets:addMask("127.0.0.0/8")
privateNets:addMask("10.0.0.0/8")
privateNets:addMask("172.16.0.0/12")
privateNets:addMask("192.168.0.0/16")

-- 1) results.com.br tem split-horizon nativo via PowerDNS Views (variante
--    "..internal"). TODA consulta para essa zona vai direto para "auth"
--    (ver useProxyProtocol acima) — é o pdns-auth, com o IP real do
--    cliente em mãos, quem decide qual variante responder. Não roteamos
--    por origem aqui: faríamos exatamente o trabalho que o Views já faz,
--    e pior, sem preservar o IP original se passasse pelo recursor.
addAction(QNameSuffixRule({"results.com.br."}), PoolAction("auth"))

-- 2) Demais consultas de clientes externos → auth direto (autoritativo,
--    sem recursão aberta para a internet)
addAction(NotRule(NetmaskGroupRule(privateNets)), PoolAction("auth"))

-- 3) Demais consultas de clientes internos → recurse (cache + resolução
--    geral; forward-zones.conf encaminha as outras zonas hospedadas aqui
--    de volta para o pdns-auth)
addAction(AllRule(), PoolAction("recurse"))
