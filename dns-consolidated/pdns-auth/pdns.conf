# ─── PowerDNS Authoritative — pdns.conf ─────────────────────────────────────
# Backend: LMDB local (volume pdns-auth-lmdb), necessário para Views
#   (split-horizon nativo — disponível só no backend LMDB, não no gmysql).
# Dados de zona são populados via API REST (scripts/apply-zones-api.sh e
#   scripts/apply-views-api.sh), não via SQL/seed.
# Escuta: porta 53 interna do container (dnsdist mapeia para :5300 no host)

# Escuta em todos os IPs do container
local-address=0.0.0.0
local-port=53

# Backend LMDB
launch=lmdb
lmdb-filename=/var/lib/powerdns/pdns.lmdb
lmdb-shards=64
lmdb-sync-mode=nosync
lmdb-schema-version=6

# Views (split-horizon nativo) — requer zone cache habilitado
views=yes
zone-cache-refresh-interval=300

# Proxy Protocol — o dnsdist (10.53.53.13) repassa o IP real do cliente via
# cabeçalho PROXYv2 (useProxyProtocol=true em dnsdist.conf). Sem isso, Views
# enxergaria sempre o IP do dnsdist como origem e nunca selecionaria a
# variante "..internal" para clientes internos.
proxy-protocol-from=10.53.53.13/32

# API REST (para pdnsutil, exporter, scripts de população de zonas/views)
api=yes
api-key=PDNS_API_KEY_PLACEHOLDER
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=127.0.0.1,10.53.53.0/24,10.0.0.0/8

# Sem recursão no authoritative
no-shuffle=yes

# Logging
loglevel=4
log-dns-details=no
log-dns-queries=no

# Cache
query-cache-ttl=20
negquery-cache-ttl=60

# Segurança
allow-axfr-ips=127.0.0.1,10.53.53.0/24,10.10.2.0/24
allow-notify-from=10.10.2.0/24,10.53.53.0/24

# NSEC3 / DNSSEC desabilitado (pode ser ativado depois)
default-soa-content=@ hostmaster.@ 0 10800 3600 604800 3600
