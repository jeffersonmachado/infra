# ─── PowerDNS Authoritative — pdns.conf ─────────────────────────────────────
# Backend: MariaDB em 10.10.2.99 (banco existente do PowerDNS atual)
# Escuta: porta 53 interna do container (dnsdist mapeia para :5300 no host)

# Escuta em todos os IPs do container
local-address=0.0.0.0
local-port=53

# Backend MySQL (mesmo banco do PowerDNS atual em 10.10.2.51)
launch=gmysql
gmysql-host=10.10.2.99
gmysql-port=3306
gmysql-dbname=results
gmysql-user=resultsdba
gmysql-password=PDNS_DB_PASSWORD_PLACEHOLDER
gmysql-dnssec=no

# API REST (para pdnsutil, exporter, subdomain-sync)
api=yes
api-key=PDNS_API_KEY_PLACEHOLDER
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=127.0.0.1,172.29.53.0/24,10.0.0.0/8

# Sem recursão no authoritative
no-shuffle=yes
# out-of-zone-additional-processing removido (não existe no pdns-auth-49)

# Logging
loglevel=4
log-dns-details=no
log-dns-queries=no

# Cache
query-cache-ttl=20
negquery-cache-ttl=60

# Segurança
allow-axfr-ips=127.0.0.1,172.29.53.0/24,10.10.2.0/24
allow-notify-from=10.10.2.0/24,172.29.53.0/24

# NSEC3 / DNSSEC desabilitado (pode ser ativado depois)
default-soa-content=@ hostmaster.@ 0 10800 3600 604800 3600
