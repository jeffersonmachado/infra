# ─── PowerDNS Authoritative — pdns.conf ─────────────────────────────────────
# Backend: MariaDB definido no .env (banco existente do PowerDNS atual)
# Escuta: porta 53 interna do container (dnsdist mapeia para :5300 no host)

# Escuta em todos os IPs do container
local-address=0.0.0.0
local-port=53

# Backend MySQL
launch=gmysql
gmysql-host=DNS_DB_HOST_PLACEHOLDER
gmysql-port=DNS_DB_PORT_PLACEHOLDER
gmysql-dbname=DNS_DB_NAME_PLACEHOLDER
gmysql-user=DNS_DB_USER_PLACEHOLDER
gmysql-password=DNS_DB_PASSWORD_PLACEHOLDER
gmysql-dnssec=no
gmysql-innodb-read-committed=no

# API REST (para pdnsutil, exporter, subdomain-sync)
api=yes
api-key=PDNS_API_KEY_PLACEHOLDER
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=127.0.0.1,10.53.53.0/24,10.0.0.0/8

# Sem recursão no authoritative
no-shuffle=yes
# out-of-zone-additional-processing removido (não existe no pdns-auth-49)

# Logging
loglevel=4
log-dns-details=no
log-dns-queries=no

# Cache
query-cache-ttl=20
negquery-cache-ttl=60

# Segurança
allow-axfr-ips=127.0.0.1,10.53.53.0/24,10.10.2.0/24
allow-notify-from=10.10.2.0/24,10.53.53.0/24

# NSEC3 / DNSSEC desabilitado (pode ser ativado depois)
default-soa-content=@ hostmaster.@ 0 10800 3600 604800 3600
