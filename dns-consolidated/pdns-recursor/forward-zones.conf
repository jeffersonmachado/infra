# ─── Zonas com forward para pdns-auth (split-horizon) ────────────────────────
# Clientes internos recebem IPs privados (10.10.2.x) para estes domínios
# Clientes externos recebem IPs públicos (201.6.110.53) via auth direto
#
# Formato: dominio=ip_auth:porta
# pdns-auth escuta em 10.53.53.11:53 (interno Docker)

# Domínios com split-horizon (IPs diferentes interno/externo)
results.com.br=10.53.53.11
lianja.com.br=10.53.53.11
olimpicshape.com.br=10.53.53.11
upsupernet.com.br=10.53.53.11

# Domínio interno
results.intranet=10.53.53.11

# Overrides locais (bloqueios / redirecionamentos internos)
netflix.com=10.53.53.11

# Zona DDNS interna
my.ddns.internal.zone=10.53.53.11

# Reverse DNS interno
2.10.10.in-addr.arpa=10.53.53.11
1.168.192.in-addr.arpa=10.53.53.11

# Domínios hospedados (sem split-horizon — endereço público é o mesmo)
# dpaautopecas.com.br=10.53.53.11  # descomente se precisar override interno
# escolamaat.com.br=10.53.53.11
# economiatotal.com.br=10.53.53.11
