# ─── Zonas com forward para pdns-auth ────────────────────────────────────────
# pdns-auth (10.53.53.11:53, interno Docker) hospeda estas zonas autoritativas;
# encaminhamos para lá em vez de tentar resolver via internet (evita
# NXDOMAIN/SERVFAIL para domínios internos/hospedados).
#
# results.com.br NÃO está nesta lista de propósito: tem split-horizon nativo
# via PowerDNS Views (variante "..internal", ver dns-consolidated/zones/).
# O dnsdist intercepta consultas para essa zona ANTES de chegarem ao recursor
# e as envia direto para pdns-auth com Proxy Protocol, preservando o IP real
# do cliente — é o pdns-auth quem decide a variante, não o forward aqui.
# Ver dnsdist/dnsdist.conf (regra QNameSuffixRule) e pdns-auth/pdns.conf
# (proxy-protocol-from).
#
# Formato: dominio=ip_auth:porta
lianja.com.br=10.53.53.11
olimpicshape.com.br=10.53.53.11

# Domínio interno (+ = recursivo: pdns-auth resolve CNAMEs internos)
+results.intranet=10.53.53.11

# Zona DDNS interna
my.ddns.internal.zone=10.53.53.11

# Reverse DNS interno
2.10.10.in-addr.arpa=10.53.53.11
1.168.192.in-addr.arpa=10.53.53.11

# Domínios hospedados — forward para pdns-auth (evita NXDOMAIN por resolver via internet)
escolamaat.com.br=10.53.53.11
# dpaautopecas.com.br: removido — DNS migrado para Locaweb (ns2.locaweb.com.br,
# A=186.202.135.240); manter aqui sobrescreveria com dados desatualizados.
# alltvblack, baladaesporte, botecoesporte: removidos — sem arquivos de zona
# no BIND legado nem no banco atual; a existirem, recriar em zones/ e readicionar aqui.

# Reverse DNS público (15.51.187, 155.12.201, 255.108.189): removidos — não
# foram encontrados no BIND legado; provavelmente delegações extintas.
