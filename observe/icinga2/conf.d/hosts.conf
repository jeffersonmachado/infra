/**
 * Hosts monitorados pelo R-Observe stack.
 * Endereços resolvíveis dentro da rede observe-internal / observe-monitoring.
 */

object Host "observe-api" {
  address       = "observe-api"
  display_name  = "R-Observe API"
  check_command = "hostalive"
  vars.os       = "Linux"
  vars.http_vhosts["health"] = {
    http_uri  = "/observe/api/health"
    http_port = 3000
  }
}

