server {
    listen 80;
    server_name _;

    # Resolver interno do Docker — resolve upstreams em tempo de requisição,
    # não no startup, permitindo que o nginx suba mesmo com serviços opcionais ausentes.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /observe/api → R-Observe API
    location /observe/api/ {
        limit_req zone=observe_api burst=50 nodelay;

        proxy_pass         http://observe-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # Rate limit extra em endpoints de eventos
    location ~ ^/observe/api/(events|icinga/events) {
        limit_req zone=observe_events burst=20 nodelay;

        proxy_pass         http://observe-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /observe/settings → UI de configuração do provider de IA
    location = /observe/ai {
        proxy_pass         http://observe-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /observe/settings {
        proxy_pass         http://observe-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /observe/discovery/api/discovery/* -> r-observe-discovery API
    location /observe/discovery/api/ {
        limit_req zone=observe_api burst=50 nodelay;

        rewrite ^/observe/discovery/api/(.*)$ /api/$1 break;
        proxy_pass         http://observe-discovery:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # /observe/discovery -> UI React do discovery
    location = /observe/discovery {
        proxy_pass         http://observe-discovery:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /observe/discovery/data/ {
        proxy_pass         http://observe-discovery:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /icinga → IcingaWeb2 (opcional — retorna 502 se o perfil icinga não estiver ativo)
    # IcingaWeb2 — proxy com rewrite de path, redirects e reescrita de hrefs HTML
    location /icinga/ {
        set $icinga_upstream http://observe-icingaweb2:8080;
        rewrite ^/icinga/(.*)$ /$1 break;
        proxy_pass            $icinga_upstream;
        proxy_http_version    1.1;
        proxy_set_header      Host              $http_host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_set_header      X-Forwarded-Host  $host;
        proxy_set_header      X-Forwarded-Port  443;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        add_header           Content-Security-Policy "upgrade-insecure-requests" always;
        # Reescreve Location headers: /foo → http://host:port/icinga/foo
        proxy_redirect        ~^/(?!icinga/)(.*)$ https://$http_host/icinga/$1;
        # Reescreve hrefs/actions no HTML para incluir /icinga/ (form action, links, etc.)
        proxy_set_header      Accept-Encoding "";
        sub_filter            'action="/'    'action="/icinga/';
        sub_filter            'href="/'      'href="/icinga/';
        sub_filter            'src="/'       'src="/icinga/';
        sub_filter            'href="http://$host/icinga/' 'href="https://$host/icinga/';
        sub_filter            'src="http://$host/icinga/'  'src="https://$host/icinga/';
        # Results brand override — injeta CSS antes do </head>
        sub_filter            '</head>' '<style>#login{background:radial-gradient(ellipse at 50% 60%,#1a0005 0%,#06062b 100%)!important}#login::before{content:"";position:fixed;width:55vw;height:55vw;max-width:900px;border-radius:50%;background:radial-gradient(circle,rgba(204,18,18,.18) 0%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}.orb{filter:hue-rotate(150deg) saturate(.9) brightness(.8)!important}#login input[type=submit]{background:#CC1212!important;border-color:#CC1212!important}#login input[type=submit]:hover{background:#a80e0e!important}#login input[type=submit]:focus{outline-color:rgba(204,18,18,.5)!important}#login input[type=text]:focus,#login input[type=password]:focus{border-color:#CC1212!important;box-shadow:0 0 0 2px rgba(204,18,18,.2)!important}.logo-wrapper::before{content:"Results \00B7 Sistemas de Inform\00E1tica";display:block;text-align:center;color:#CC1212;font-size:.72em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5em;font-family:Segoe UI,Arial,sans-serif}</style></head>';
        sub_filter_once       off;
        sub_filter_types      text/html application/javascript application/json text/css text/plain;
    }

    # Catch-all para paths do IcingaWeb2 sem /icinga/ (form submits diretos)
    location ~ ^/(authentication|dashboard|monitoring|icingadb|layout|application-state|img|css|js|font)(/|$) {
        return 307 /icinga$request_uri;
    }

    # /grafana → Grafana (opcional — retorna 502 se o perfil monitoring não estiver ativo)
    location /grafana/ {
        set $grafana_upstream http://observe-grafana:3000;
        proxy_pass         $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Health do próprio proxy
    location /observe/proxy/health {
        access_log off;
        return 200 '{"status":"ok","service":"observe-proxy"}';
        add_header Content-Type application/json;
    }

    # Bloqueia acesso direto à raiz
    location = / {
        return 301 /observe/settings;
    }

    location / {
        return 404;
    }
}
