server {
    listen 80;
    server_name _;

    # /observe/api → R-Observe API
    location /observe/api/ {
        limit_req zone=observe_api burst=50 nodelay;

        proxy_pass         http://observe-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # Rate limit extra em endpoints de eventos
    location ~ ^/observe/api/(events|icinga/events) {
        limit_req zone=observe_events burst=20 nodelay;

        proxy_pass         http://observe-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /icinga → IcingaWeb2
    location /icinga/ {
        proxy_pass         http://observe-icingaweb2:8080/icingaweb2/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # /grafana → Grafana
    location /grafana/ {
        proxy_pass         http://observe-grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Health do próprio proxy
    location /observe/proxy/health {
        access_log off;
        return 200 '{"status":"ok","service":"observe-proxy"}';
        add_header Content-Type application/json;
    }

    # Bloqueia acesso direto à raiz
    location = / {
        return 301 /observe/api/health;
    }

    location / {
        return 404;
    }
}
