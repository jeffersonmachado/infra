global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    product: 'r-observe'
    environment: 'production'

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:

  # R-Observe API
  - job_name: 'r-observe-api'
    metrics_path: '/observe/api/metrics'
    static_configs:
      - targets: ['observe-api:3000']
        labels:
          service: 'r-observe-api'

  # R-Observe Worker
  - job_name: 'r-observe-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['observe-worker:3000']
        labels:
          service: 'r-observe-worker'

  # R-Observe AI
  - job_name: 'r-observe-ai'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['observe-ai:3000']
        labels:
          service: 'r-observe-ai'

  # R-Observe Agent
  - job_name: 'r-observe-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['observe-agent:3000']
        labels:
          service: 'r-observe-agent'

  # Prometheus self-scrape
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OTel Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['observe-otel-collector:8888']
        labels:
          service: 'otel-collector'
