global
    maxconn 4096
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 10s
    timeout client  1m
    timeout server  1m
    log             global
    option          tcplog

# ─── Frontend HTTP (porta 80) ─────────────────────────────────────────────────
# Roteamento HTTP por Host para subdomínios específicos.
# O secure-httpd (Apache) trata ACME/Let's Encrypt automaticamente via mod_md.
frontend http_in
    bind *:80
    mode http
    option forwardfor
    option http-server-close

    # Todo tráfego HTTP vai ao Apache (secure-httpd) que gerencia os certificados
    default_backend apache_http

# ─── Frontend HTTPS (porta 443) — SNI Layer 4 ────────────────────────────────
# TCP puro: HAProxy inspeciona o SNI sem decriptar. O backend faz TLS.
frontend https_sni
    bind *:443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # SoftEther VPN (termina TLS no VPN, não no Apache)
    use_backend softether_rvpn if { req.ssl_sni -i rvpn.results.com.br }

    # Todos os outros subdomínios (incluindo r-observe.results.com.br) →
    # Apache (secure-httpd) que tem os certs mod_md e faz ProxyPass
    default_backend apache_https

# ─── Backends ─────────────────────────────────────────────────────────────────

backend softether_rvpn
    mode tcp
    server rvpn 10.10.2.30:443 check

backend apache_https
    mode tcp
    server apache 10.10.2.60:18443 check

backend apache_http
    mode http
    option forwardfor
    server apache 10.10.2.60:8080 check
