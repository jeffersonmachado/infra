global
    maxconn 4096
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 10s
    timeout client  24h
    timeout server  24h
    timeout tunnel  24h
    log             global
    option          tcplog
    option          clitcpka
    option          srvtcpka

# ─── Frontend HTTPS (porta 443) — SNI Layer 4 ────────────────────────────────
# TCP puro: HAProxy inspeciona o SNI sem decriptar. O backend faz TLS.
frontend https_sni
    bind 10.10.2.60:443
    mode tcp
    tcp-request inspect-delay 1s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # SoftEther VPN (termina TLS no VPN, não no Apache)
    use_backend softether_rvpn if { req.ssl_sni -i rvpn.results.com.br }

    # Navegadores e clientes HTTPS modernos enviam SNI e seguem ao Apache.
    # O cliente SoftEther nao envia SNI reconhecivel antes da negociacao
    # propria; por isso conexoes sem SNI usam o backend VPN como fallback.
    use_backend apache_https if { req.ssl_sni -m found }
    default_backend softether_rvpn

# ─── Backends ─────────────────────────────────────────────────────────────────

backend softether_rvpn
    mode tcp
    server rvpn 10.10.2.30:443 check

backend apache_https
    mode tcp
    server apache 10.10.2.60:18443 check
