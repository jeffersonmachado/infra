services:
  edge-sni:
    image: haproxy:2.9-alpine
    container_name: edge-sni
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./edge-sni/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 10.10.2.60 443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
