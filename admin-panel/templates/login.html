<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Admin · Results</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
     background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%)}
.panel{background:rgb(30 41 59/.85);backdrop-filter:blur(24px);border:1px solid rgb(99 102 241/.2);
     border-radius:20px;padding:44px 36px;width:100%;max-width:420px;box-shadow:0 25px 60px rgb(0 0 0/.5)}
.logo{text-align:center;margin-bottom:32px}
.logo .icon{width:56px;height:56px;margin:0 auto 16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);
     border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px}
.logo h1{font-size:22px;font-weight:700;color:#f1f5f9;letter-spacing:-.5px}
.logo p{font-size:13px;color:#94a3b8;margin-top:4px}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.field input{width:100%;padding:12px 16px;background:rgb(15 23 42/.6);border:1px solid rgb(51 65 85/.8);
     border-radius:12px;font-size:14px;color:#e2e8f0;font-family:inherit;transition:all .2s;outline:none}
.field input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgb(99 102 241/.15)}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:12px;
     color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgb(99 102 241/.35)}
.error{background:rgb(127 29 29/.4);border:1px solid rgb(220 38 38/.3);color:#fca5a5;padding:12px 16px;
     border-radius:12px;font-size:13px;text-align:center;margin-bottom:20px}
</style>
</head>
<body>
<div class="panel">
  <div class="logo">
    <div class="icon">⚙</div>
    <h1>Painel Admin</h1>
    <p>Results · Infraestrutura</p>
  </div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="field"><label>Usuário</label><input type="text" name="user" placeholder="uid ou cn" required autofocus></div>
    <div class="field"><label>Senha</label><input type="password" name="pass" placeholder="••••••••" required></div>
    <button type="submit" class="btn">Entrar</button>
  </form>
</div>
</body>
</html>
