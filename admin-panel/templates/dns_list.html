<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DNS · Results</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0b0f19;color:#e2e8f0;min-height:100vh}
.topbar{background:rgb(15 18 30/.9);backdrop-filter:blur(20px);border-bottom:1px solid rgb(51 65 85/.5);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar .brand{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.topbar .brand span{background:linear-gradient(135deg,#3b82f6,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar nav{display:flex;gap:4px;font-size:13px}
.topbar nav a{color:#94a3b8;text-decoration:none;padding:6px 14px;border-radius:8px;transition:all .2s;font-weight:500}
.topbar nav a:hover{color:#e2e8f0;background:rgb(59 130 246/.12)}
.page{padding:32px;max-width:1100px;margin:0 auto}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.toolbar h1{font-size:24px;font-weight:700;margin:0}
.btn{padding:10px 20px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;text-decoration:none;display:inline-block}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}
.btn-primary:hover{box-shadow:0 4px 15px rgb(59 130 246/.3);transform:translateY(-1px)}
table{width:100%;border-collapse:collapse;background:rgb(15 23 42/.5);border-radius:14px;overflow:hidden;border:1px solid rgb(51 65 85/.3)}
th,td{padding:14px 18px;text-align:left;border-bottom:1px solid rgb(51 65 85/.2);font-size:13px}
th{background:rgb(30 41 59/.6);font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#64748b;font-weight:600}
tr:hover{background:rgb(59 130 246/.04)}
td a{color:#93c5fd;text-decoration:none;font-weight:500} td a:hover{color:#bfdbfe}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;background:rgb(59 130 246/.15);color:#93c5fd}
.empty{text-align:center;padding:60px;color:#475569}
.modal-overlay{display:none;position:fixed;inset:0;background:rgb(0 0 0/.6);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:linear-gradient(145deg,rgb(30 41 59/.95),rgb(15 23 42/.95));border:1px solid rgb(51 65 85/.6);border-radius:18px;padding:32px;width:100%;max-width:460px;box-shadow:0 25px 60px rgb(0 0 0/.6)}
.modal h2{font-size:18px;font-weight:600;margin-bottom:20px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.fg label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#64748b;font-weight:600}
.fg input,.fg select{padding:10px 14px;border:1px solid rgb(51 65 85/.6);border-radius:10px;background:rgb(15 23 42/.6);color:#e2e8f0;font-size:13px;font-family:inherit;outline:none}
.fg input:focus,.fg select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgb(59 130 246/.1)}
.btns{display:flex;gap:10px;margin-top:20px}
.btn-cancel{background:#334155;color:#94a3b8}
</style>
</head>
<body>
<div class="topbar"><div class="brand">🌐 <span>DNS</span></div><nav><a href="/">Dashboard</a><a href="/vhosts">VHosts</a><a href="/ldap">LDAP</a><a href="/logout">Sair</a></nav></div>
<div class="page">
  <div class="toolbar"><h1>🌐 Zonas DNS</h1><button class="btn btn-primary" onclick="openModal()">+ Nova Zona</button></div>
  {% if zones %}
  <table><thead><tr><th>Zona</th><th>Tipo</th><th>Registros</th></tr></thead><tbody>
  {% for z in zones %}<tr><td><a href="/dns/{{ z.id }}">{{ z.name }}</a></td><td><span class="tag">{{ z.kind }}</span></td><td>{{ z.rrsets|length if z.rrsets else '—' }}</td></tr>{% endfor %}
  </tbody></table>
  {% else %}<div class="empty">Nenhuma zona ou API indisponível.</div>{% endif %}
</div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>Nova Zona DNS</h2>
    <form method="POST" action="/dns/create">
      <div class="fg"><label>Domínio *</label><input name="name" placeholder="exemplo.com.br" required autofocus></div>
      <div class="btns"><button class="btn btn-primary">Criar</button><button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button></div>
    </form>
  </div>
</div>
<script>
function openModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()})
</script>
</body>
</html>
