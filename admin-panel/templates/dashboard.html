<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Results</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;background:#0b0f19;color:#e2e8f0}
.topbar{background:rgb(15 18 30/.9);backdrop-filter:blur(20px);border-bottom:1px solid rgb(51 65 85/.5);
        padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar .brand{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.topbar .brand span{background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar .right{display:flex;align-items:center;gap:20px;font-size:13px}
.topbar .right a{color:#94a3b8;text-decoration:none;font-weight:500;padding:6px 14px;border-radius:8px;border:1px solid rgb(51 65 85/.5);transition:all .2s}
.topbar .right a:hover{color:#e2e8f0;border-color:rgb(99 102 241/.4);background:rgb(99 102 241/.08)}
.avatar{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;margin-right:6px}
.page{padding:40px 32px;max-width:1200px;margin:0 auto}
.greeting{font-size:28px;font-weight:700;margin-bottom:8px;letter-spacing:-.5px}
.greeting span{background:linear-gradient(135deg,#6366f1,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#64748b;font-size:14px;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.card{background:linear-gradient(145deg,rgb(30 41 59/.7),rgb(15 23 42/.7));border:1px solid rgb(51 65 85/.4);
      border-radius:18px;padding:32px 28px;text-decoration:none;color:inherit;transition:all .25s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 20px 40px rgb(0 0 0/.4),0 0 0 1px var(--accent)}
.card-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:20px}
.card h2{font-size:18px;font-weight:600;margin-bottom:8px;color:#f1f5f9}
.card p{font-size:13px;color:#64748b;line-height:1.6}
.c-dns .card-icon{background:rgb(59 130 246/.15)} .c-dns{--accent:#3b82f6}
.c-vhosts .card-icon{background:rgb(34 197 94/.15)} .c-vhosts{--accent:#22c55e}
.c-ldap .card-icon{background:rgb(236 72 153/.15)} .c-ldap{--accent:#ec4899}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">⚙ <span>Results</span> Admin</div>
  <div class="right"><span class="avatar">{{ user[0]|upper }}</span>{{ user }} <a href="/logout">Sair</a></div>
</div>
<div class="page">
  <div class="greeting">Olá, <span>{{ user }}</span></div>
  <div class="subtitle">Selecione uma ferramenta</div>
  <div class="grid">
    {% for card in cards %}
    {% set cls = 'c-dns' if 'DNS' in card.title else 'c-vhosts' if 'Hosts' in card.title else 'c-ldap' %}
    <a href="{{ card.url }}" class="card {{ cls }}">
      <div class="card-icon">{{ card.icon }}</div>
      <h2>{{ card.title }}</h2>
      <p>{{ card.desc }}</p>
    </a>
    {% endfor %}
  </div>
</div>
</body>
</html>
