<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LDAP · Results</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0b0f19;color:#e2e8f0;min-height:100vh}
.topbar{background:rgb(15 18 30/.9);backdrop-filter:blur(20px);border-bottom:1px solid rgb(51 65 85/.5);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar .brand{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.topbar .brand span{background:linear-gradient(135deg,#ec4899,#be185d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar nav{display:flex;gap:4px;font-size:13px}
.topbar nav a{color:#94a3b8;text-decoration:none;padding:6px 14px;border-radius:8px;transition:all .2s;font-weight:500}
.topbar nav a:hover{color:#e2e8f0;background:rgb(236 72 153/.12)}
.page{padding:32px;max-width:1100px;margin:0 auto}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.toolbar h1{font-size:24px;font-weight:700;margin:0}
.btn{padding:10px 20px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;text-decoration:none;display:inline-block}
.btn-primary{background:linear-gradient(135deg,#ec4899,#be185d);color:#fff}
.btn-primary:hover{box-shadow:0 4px 15px rgb(236 72 153/.3);transform:translateY(-1px)}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:8px}
.btn-danger{background:rgb(220 38 38/.15);color:#fca5a5;border:1px solid rgb(220 38 38/.25)}
.btn-danger:hover{background:rgb(220 38 38/.3)}
.section{margin-bottom:28px}
.section h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:#64748b;margin-bottom:10px;font-weight:600}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:rgb(236 72 153/.12);color:#f9a8d4;border:1px solid rgb(236 72 153/.2)}
.tag .del{font-size:14px;cursor:pointer;opacity:.5;transition:opacity .2s}
.tag .del:hover{opacity:1}
table{width:100%;border-collapse:collapse;background:rgb(15 23 42/.5);border-radius:14px;overflow:hidden;border:1px solid rgb(51 65 85/.3)}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid rgb(51 65 85/.2);font-size:13px}
th{background:rgb(30 41 59/.6);font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#64748b;font-weight:600}
tr:hover{background:rgb(236 72 153/.03)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgb(0 0 0/.6);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:linear-gradient(145deg,rgb(30 41 59/.95),rgb(15 23 42/.95));border:1px solid rgb(51 65 85/.6);border-radius:18px;padding:32px;width:100%;max-width:520px;box-shadow:0 25px 60px rgb(0 0 0/.6)}
.modal h2{font-size:18px;font-weight:600;margin-bottom:20px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.fg label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#64748b;font-weight:600}
.fg input,.fg select{padding:10px 14px;border:1px solid rgb(51 65 85/.6);border-radius:10px;background:rgb(15 23 42/.6);color:#e2e8f0;font-size:13px;font-family:inherit;outline:none}
.fg input:focus,.fg select:focus{border-color:#ec4899;box-shadow:0 0 0 3px rgb(236 72 153/.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btns{display:flex;gap:10px;margin-top:20px}
.btn-cancel{background:#334155;color:#94a3b8}
</style>
</head>
<body>
<div class="topbar"><div class="brand">👥 <span>LDAP</span></div><nav><a href="/">Dashboard</a><a href="/dns">DNS</a><a href="/vhosts">VHosts</a><a href="/logout">Sair</a></nav></div>
<div class="page">
  <div class="toolbar"><h1>👥 Usuários & Grupos</h1><button class="btn btn-primary" onclick="openUserModal()">+ Novo Usuário</button></div>
  <div class="section">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
      <h2 style="margin:0">Grupos</h2>
      <button class="btn btn-sm btn-primary" onclick="openGroupModal()">+ Grupo</button>
    </div>
    <div class="tags">
      {% for g in groups %}<span class="tag">{{ g }}<form method="POST" action="/ldap/group/delete" style="display:inline"><input type="hidden" name="dn" value="cn={{ g }},{{ groups_dn }}"><button class="del" title="Excluir">✕</button></form></span>{% endfor %}
      {% if not groups %}<span style="color:#64748b;font-size:13px">Nenhum grupo</span>{% endif %}
    </div>
  </div>
  <div class="section">
    <h2>Usuários ({{ users|length }})</h2>
    <table><thead><tr><th>UID</th><th>Nome</th><th>Email</th><th></th></tr></thead><tbody>
    {% for u in users %}<tr><td style="font-weight:600">{{ u.uid }}</td><td>{{ u.cn }}</td><td style="color:#94a3b8">{{ u.mail or '—' }}</td>
    <td><button class="btn btn-sm btn-primary" onclick="editUser('{{ u.dn }}','{{ u.uid }}','{{ u.cn }}','{{ u.mail }}')">Editar</button>
    <form method="POST" action="/ldap/user/delete" style="display:inline" onsubmit="return confirm('Excluir {{ u.uid }}?')"><input type="hidden" name="dn" value="{{ u.dn }}"><button class="btn btn-sm btn-danger">✕</button></form></td></tr>{% endfor %}
    </tbody></table>
  </div>
</div>

<!-- Modal Usuário -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <h2 id="userTitle">Novo Usuário</h2>
    <form method="POST" action="/ldap/user/save"><input type="hidden" id="old_uid" name="old_uid" value="">
    <div class="form-row">
      <div class="fg"><label>UID *</label><input name="uid" id="f_uid" required></div>
      <div class="fg"><label>Nome *</label><input name="cn" id="f_cn" required></div>
    </div>
    <div class="fg"><label>Email</label><input name="mail" id="f_mail"></div>
    <div class="fg"><label>ObjectClass</label><select name="objectClass" id="f_objclass"><option value="inetOrgPerson">inetOrgPerson</option><option value="organizationalRole">organizationalRole</option><option value="account">account</option><option value="simpleSecurityObject">simpleSecurityObject</option></select></div>
    <div class="fg"><label>Senha (vazio = não alterar)</label><input name="password" type="password" id="f_password"></div>
    <div class="btns"><button class="btn btn-primary">Salvar</button><button type="button" class="btn btn-cancel" onclick="closeUserModal()">Cancelar</button></div>
    </form>
  </div>
</div>

<!-- Modal Grupo -->
<div class="modal-overlay" id="groupModal">
  <div class="modal">
    <h2>Novo Grupo</h2>
    <form method="POST" action="/ldap/group/save">
    <div class="fg"><label>Nome do Grupo *</label><input name="cn" placeholder="ex: my-admins" required autofocus></div>
    <div class="btns"><button class="btn btn-primary">Criar</button><button type="button" class="btn btn-cancel" onclick="closeGroupModal()">Cancelar</button></div>
    </form>
  </div>
</div>

<script>
function openUserModal(){document.getElementById('userModal').classList.add('show')}
function closeUserModal(){document.getElementById('userModal').classList.remove('show');resetUserForm()}
function openGroupModal(){document.getElementById('groupModal').classList.add('show')}
function closeGroupModal(){document.getElementById('groupModal').classList.remove('show')}
function editUser(dn,uid,cn,mail){openUserModal();document.getElementById('userTitle').textContent='Editar Usuário';
  document.getElementById('old_uid').value=uid;document.getElementById('f_uid').value=uid;
  document.getElementById('f_cn').value=cn;document.getElementById('f_mail').value=mail||''}
function resetUserForm(){document.getElementById('userTitle').textContent='Novo Usuário';
  ['old_uid','f_uid','f_cn','f_mail','f_password'].forEach(function(id){document.getElementById(id).value=''});
  document.getElementById('f_objclass').value='inetOrgPerson'}
document.getElementById('userModal').addEventListener('click',function(e){if(e.target===this)closeUserModal()})
document.getElementById('groupModal').addEventListener('click',function(e){if(e.target===this)closeGroupModal()})
</script>
</body>
</html>
